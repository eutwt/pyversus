[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyversus2"
version = "0.1.0"
description = "Compare tabular data quickly with DuckDB or PySpark"
readme = "README.md"
authors = [{name = "versus authors"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.7.1"
dependencies = [
  "duckdb>=1.0.0",
  "typing-extensions>=4.0.0; python_version < \"3.8\""
]

[project.optional-dependencies]
spark = [
  "pandas>=1.3,<2; python_version < \"3.8\"",
  "pandas>=1.5; python_version >= \"3.8\"",
  "pyspark>=3.4,<3.5; python_version < \"3.8\"",
  "pyspark>=3.5,<4; python_version >= \"3.8\" and python_version < \"3.9\"",
  "pyspark>=4,<5; python_version >= \"3.9\""
]
docs = [
  "sphinx>=7.2; python_version >= \"3.9\"",
  "pydata-sphinx-theme>=0.15.4; python_version >= \"3.9\"",
  "numpydoc>=1.6; python_version >= \"3.9\"",
  "sphinx-copybutton>=0.5.2; python_version >= \"3.9\""
]
benchmark = [
  "nycflights13==0.0.3; python_version >= \"3.9\"",
  "pandas>=1.5; python_version >= \"3.9\"",
  "psutil>=5.9; python_version >= \"3.9\"",
  "setuptools<81; python_version >= \"3.9\""
]

[dependency-groups]
dev = [
  "pandas>=1.3,<2; python_version < \"3.8\"",
  "pandas>=1.5; python_version >= \"3.8\"",
  "polars>=0.20; python_version >= \"3.9\"",
  "pyarrow<10; python_version < \"3.8\"",
  "pyarrow; python_version >= \"3.8\"",
  "pytest>=7.4,<8; python_version < \"3.8\"",
  "pytest>=8.0.0; python_version >= \"3.8\"",
  "ruff>=0.15.0; python_version >= \"3.8\"",
  "ty>=0.0.29; python_version >= \"3.9\""
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py37"
